name: Smoke Test
on:
  workflow_call:
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_PASSWORD:
        required: true
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to start
        run: sleep 30

      - name: Check internal services via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            check() {
              name="$1"
              url="$2"
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$status" != "200" ]; then
                echo "$name KO ($status)"
                exit 1
              fi
              echo "$name OK ($status)"
            }

            check "Eureka"          "http://localhost:8761/actuator/health"
            check "Config Server"   "http://localhost:8888/actuator/health"
            check "Billing Service" "http://localhost:8081/api/billing/actuator/health"
            check "IAM Service"     "http://localhost:8085/api/iam/actuator/health"
            check "NOTIFICATION SERVER" "http://localhost:8086/api/notification-service/actuator/health"
            check "AUDIT SERVER" "http://localhost:8087/api/audit-service/actuator/health"

      - name: Check Frontend via Nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            https://kerp-web.duckdns.org/)
          [[ "$STATUS" = "200" || "$STATUS" = "401" ]] || (echo "Frontend KO ($STATUS)" && exit 1)
          echo "Frontend OK ($STATUS)"
